name: Go
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - name: Run race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Build examples
        run: |
          go build ./example/...
          go build -o /dev/null ./example/usage.go
